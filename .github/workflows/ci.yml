name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 项目核心场景是读取 Windows 通达信安装目录下的 .day 文件，
        # 路径分隔符 / GBK 文件名 / tzdata 时区行为在 Windows 上与 Linux 不同，
        # 故补充 Windows 矩阵覆盖这些平台特有路径。
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 前端 dist 被 pyproject.toml 的 force-include 引用，pip install -e .
      # 要求它存在。先构建前端（type-check + vite build）。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
        working-directory: web-ui
      # V-33（openspec 任务 1.6）：前端测试接入 test job——此前此 job 只
      # build 不 test（frontend job 有 vitest，但 Windows 矩阵不带它），
      # 平台特有回归只能靠人工点击兜底。
      - run: npm test
        working-directory: web-ui
      - run: npm run build
        working-directory: web-ui
      - run: pip install -e ".[dev]"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/unit/ -v --tb=short --cov src/easy_tdx --cov-fail-under=70
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  # ── 缠论模型审计（V733）───────────────────────────────────────────────
  # 单测只保证「代码按预期跑」，不保证「模型没有未来函数」。
  # V732 实测发现一处真实泄漏：全局 ATR 波动率取序列尾部，导致 40 组历史
  # 买卖点被"补数据"改写。单测全部通过也没能发现它 —— 是靠
  # scripts/audit_future_leak_real.py 抓到的。故固化进 CI，防止复发。
  #
  # ⚠️ 关于 continue-on-error（V733 修正）：
  # 此前整个 job 标了 continue-on-error: true，理由是"CI 抓取行情依赖外网、
  # 不应阻塞发版"。但实测这会让**未来函数门禁彻底失效** —— V732 那个真实
  # 缺陷正是靠这个 job 抓的，而 continue-on-error 下它红了也只是一条
  # "允许失败"的黄色提示，等于形同虚设（与我在 audit_rolling_oos.py 里
  # 犯的"无条件 return 0"是同一类错误）。
  # 改为**只容忍联网抓数一步**，审计三步（含未来函数）阻塞合并：
  #   - 抓数失败 → 标记 fetch_ok=false，用已提交的最小夹具（若存在）继续；
  #     若无数据，审计三步会显式失败并说明"需要行情数据"（不会静默通过）。
  #   - 审计/门禁失败 → 直接红，阻塞合并。
  chanlun-audit:
    runs-on: ubuntu-latest
    env:
      FETCH_OK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: 抓取真实行情数据（失败不阻塞，但会标记 FETCH_OK=0）
        continue-on-error: true
        run: |
          if python scripts/audit_fetch_real_data.py; then
            echo "FETCH_OK=1" >> "$GITHUB_ENV"
          else
            echo "抓取失败 —— 后续审计将用仓库内已有数据；若无数据会显式失败"
            echo "FETCH_OK=0" >> "$GITHUB_ENV"
          fi
      - name: 未来函数检测（必须为 0 违反）
        run: python scripts/audit_future_leak_real.py
      - name: 结构不变式检测（I1-I12 必须为 0 违反）
        run: python scripts/audit_chanlun_invariants.py
      # 滚动窗样本外。门禁阈值**按样本量分档**（脚本内 n_sym>=200 用 6/6，
      # 否则 5/6 + 中位为正）—— CI 默认只抓 30 只，写死 6/6 会每次假红。
      # 全量 286 只下 1buy 6/6 正、3sell 0/6 正；两档均已本地实测 exit 0。
      - name: 滚动窗样本外验证（门禁：1buy 各档均为正、3sell 不见正窗）
        run: python scripts/audit_rolling_oos.py

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 同 test job：force-include 要求 web-ui/dist 存在。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
        working-directory: web-ui
      - run: npm run build
        working-directory: web-ui
      - run: pip install -e ".[dev,web]"
      - run: mypy src/

  # 前端构建检查。web-ui 此前只有本地 vue-tsc，CI 不覆盖，
  # 类型错误 / 破坏性 import 只有发布后用户才发觉（v1.17.9 的
  # 65409694% 离谱数值 bug 即前端无回归守卫的典型后果）。
  # 与 Python 版本无关，故独立 job，避免在 test matrix 里跑 6 遍。
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
        working-directory: web-ui
      - run: npm run test
        working-directory: web-ui
      - run: npm run format:check
        working-directory: web-ui
      - run: npm run lint
        working-directory: web-ui
      - run: npm run build
        working-directory: web-ui

  # 缠论图**像素级**渲染验证（V733 第五之十九）。
  #
  # 为什么单独一个 job：前面的 chanlun-audit 只验证**数据流**
  # （中枢 ZG/ZD、买卖点锚点、笔是否与模型输出对齐），
  # 但**数据全对而图是错的**完全可能发生（坐标轴映射错、series 顺序错位）——
  # 这正是 AGENTS.md §1「数据对 ≠ 画出来对」。
  #
  # 为什么能进 CI：ubuntu-latest runner **自带 chromium**，
  # 且不依赖 playwright（直接用系统 chromium + CDP），
  # 不需要下载几百 MB 的浏览器二进制。
  #
  # ⚠️ 这个门禁**会真的红**：它是读像素的判定，图表画歪了就会挂。
  # 脚本自带牙齿（擦掉画布后必须测不到蜡烛），所以 PASS 不会是空转。
  e2e-chanlun-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
        working-directory: web-ui
      - run: npm run build
        working-directory: web-ui
      - run: pip install -e ".[dev,web]" websockets
      # ⚠️ 必须用 `easy-tdx serve`（console script）而不是
      #    `python -m easy_tdx.cli serve` —— 后者会失败：
      #    `easy_tdx.cli` 是**包**且没有 __main__.py，
      #    报 "No module named easy_tdx.cli.__main__"。本机实跑验证过。
      - name: 启动服务（真实后端 + 真实前端产物）
        run: |
          nohup easy-tdx serve --port 8000 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/ -o /dev/null; then
              echo "服务已就绪（${i}s）"; exit 0
            fi
            sleep 1
          done
          echo "❌ 60s 内服务未就绪"; tail -40 /tmp/serve.log; exit 1
      - name: 像素级渲染验证（K线/配色/顺序/缠论标记 + 牙齿）
        run: python scripts/e2e_chanlun_pixels.py --base http://127.0.0.1:8000
      - name: 失败时保留服务日志
        if: failure()
        run: tail -60 /tmp/serve.log || true
