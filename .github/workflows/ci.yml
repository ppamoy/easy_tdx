name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 项目核心场景是读取 Windows 通达信安装目录下的 .day 文件，
        # 路径分隔符 / GBK 文件名 / tzdata 时区行为在 Windows 上与 Linux 不同，
        # 故补充 Windows 矩阵覆盖这些平台特有路径。
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 前端 dist 被 pyproject.toml 的 force-include 引用，pip install -e .
      # 要求它存在。先构建前端（type-check + vite build）。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
        working-directory: web-ui
      # V-33（openspec 任务 1.6）：前端测试接入 test job——此前此 job 只
      # build 不 test（frontend job 有 vitest，但 Windows 矩阵不带它），
      # 平台特有回归只能靠人工点击兜底。
      - run: npm test
        working-directory: web-ui
      - run: npm run build
        working-directory: web-ui
      - run: pip install -e ".[dev]"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/unit/ -v --tb=short --cov src/easy_tdx --cov-fail-under=70
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  # ── 缠论模型审计（V733）───────────────────────────────────────────────
  # 单测只保证「代码按预期跑」，不保证「模型没有未来函数」。
  # V732 实测发现一处真实泄漏：全局 ATR 波动率取序列尾部，导致 40 组历史
  # 买卖点被"补数据"改写。单测全部通过也没能发现它 —— 是靠
  # scripts/audit_future_leak_real.py 抓到的。故固化进 CI，防止复发。
  #
  # 该脚本需要真实行情数据（audit_data/），由 audit_fetch_real_data.py 从
  # 新浪接口抓取；CI 无外网稳定性保证时该 job 允许失败，不阻塞发版，
  # 但失败必须在 PR 中被显式说明。
  chanlun-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: 抓取真实行情数据
        run: python scripts/audit_fetch_real_data.py
      - name: 未来函数检测（必须为 0 违反）
        run: python scripts/audit_future_leak_real.py
      - name: 结构不变式检测（I1-I12 必须为 0 违反）
        run: python scripts/audit_chanlun_invariants.py
      # 滚动窗样本外：1buy 必须 6/6 窗为正、3sell 必须 0/6 窗为正。
      # 这两个数字反过来（全样本基准）曾让我得出错误结论 —— 见 V733 报告。
      - name: 滚动窗样本外验证
        run: python scripts/audit_rolling_oos.py

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 同 test job：force-include 要求 web-ui/dist 存在。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
        working-directory: web-ui
      - run: npm run build
        working-directory: web-ui
      - run: pip install -e ".[dev,web]"
      - run: mypy src/

  # 前端构建检查。web-ui 此前只有本地 vue-tsc，CI 不覆盖，
  # 类型错误 / 破坏性 import 只有发布后用户才发觉（v1.17.9 的
  # 65409694% 离谱数值 bug 即前端无回归守卫的典型后果）。
  # 与 Python 版本无关，故独立 job，避免在 test matrix 里跑 6 遍。
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
        working-directory: web-ui
      - run: npm run test
        working-directory: web-ui
      - run: npm run format:check
        working-directory: web-ui
      - run: npm run lint
        working-directory: web-ui
      - run: npm run build
        working-directory: web-ui
