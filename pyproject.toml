[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easy-tdx"
version = "1.65.0"
description = "通达信 TCP 协议行情数据客户端，支持在线行情、离线数据读取与写入同步"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3", "tzdata>=2024.1", "click>=8.0,<9"]

[project.scripts]
easy-tdx = "easy_tdx.cli:cli"  # cli/__init__.py exposes the click group

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov", "mypy>=1.9", "ruff>=0.4", "scipy>=1.10,<1.16", "httpx>=0.27"]
science = ["scipy>=1.10,<1.16"]
web = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29"]
# 打包成桌面 EXE 用：系统托盘（pystray）+ 图标生成（Pillow）。
# 仅 PyInstaller 打包态需要，开发态 ``pip install -e .[web]`` 不强制装。
packaging = ["pystray>=0.19", "Pillow>=10.0"]

[tool.hatch.build]
# 前端 dist 是构建产物（在 .gitignore 里），hatchling 默认不打包。
# artifacts 让它被 sdist 和 wheel 都强制包含。
artifacts = [
    "web-ui/dist/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/easy_tdx"]
# 前端 dist 映射到包内 easy_tdx/web/dist/。CI（ci.yml）、publish（publish.yml）
# 和 release（release.yml）都会在 pip install / build 前先 npm run build。
force-include = { "web-ui/dist" = "easy_tdx/web/dist" }

[tool.mypy]
strict = true
python_version = "3.12"
# 跳过未跟踪的本地脚本（依赖外部 unified_config/sqlalchemy/requests，不属于库）
exclude = ["src/easy_tdx/exchange_margin\\.py"]

[[tool.mypy.overrides]]
module = ["pandas", "tabulate", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "easy_tdx.MyTT"
# Type stubs provided via MyTT.pyi — keep strict checks enabled

[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*", "pydantic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pystray / Pillow 无 type stubs；tray.py 已用 type: ignore 兜底关键调用
module = ["pystray", "pystray.*", "PIL", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["*.pyi", "src/easy_tdx/exchange_margin.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# V92+ 历史遗留：这些文件含大量既有超长行（多为缠论 docstring/注释/诊断输出），
# 在 V93 拆行改造完成前豁免 E501（其余规则仍严格检查）。新代码遵循 line-length=100。

[tool.ruff.lint.per-file-ignores]
"src/easy_tdx/chanlun/mmd.py" = ["E501"]
"src/easy_tdx/chanlun/mmd_conditions.py" = ["E501"]
"src/easy_tdx/web/routers/diagnosis.py" = ["E501"]
"src/easy_tdx/backtest/chanlun_validator.py" = ["E501"]
"src/easy_tdx/backtest/strategies/builtin.py" = ["E501"]
"src/easy_tdx/web/routers/chanlun.py" = ["E501"]
"src/easy_tdx/web/routers/monitor.py" = ["E501"]
"tests/unit/test_chanlun_v52.py" = ["E501"]
# ── scripts/ 一次性纳入 CI lint（V733）───────────────────────────────
# 背景：CI 此前只 lint `src/ tests/`，scripts/ 全目录**无门禁** —— 而本项目
# 大量**审计探针**就住在 scripts/ 里。探针自己写错 → 输出假的审计结论，
# 比产品 bug 更危险（V733 报告里的「静默失败」已多次栽在这上面）。
# 实测纳入前 scripts/ 有 180 处报错，含 4 个 F821（未定义名 = 真崩溃）。
# 处置：真缺陷类（F821/F401/F841 等）已逐个修掉；下面只豁免**排版类**，
# 保证"新增真错误一定红"，同时不让存量排版噪声阻塞 CI。
"scripts/**" = [
    "E501",  # 长行：诊断输出/表格打印，拆行收益极低
    "E701",  # 冒号后同行语句：紧凑 CLI 排版习惯
    "E702",
    "E741",  # 歧义变量名 l/I：诊断脚本循环变量
    "E731",  # lambda 赋值
    "E402",  # 模块级 import 不在顶部：脚本需先补 sys.path 才能 import
    "E401",
    "I001",  # import 排序：暂不强制，避免大面积无意义 diff
    "UP031", # % 格式化：printf 风格打印
    "UP038",
    "UP034",
    "F541",  # 无占位 f-string：打印模板常见
    "F841",  # 局部赋值未用：多为「为可读性先行解包」与调试残留，逐修收益低
]
# ⚠️ 边界（重要）：**F821 绝不豁免**。那正是
# scripts/audit_param_sensitivity.py 里 `unknown.append(k)` 引用了 main()
# 的局部变量、触发 NameError 的那一类 —— 也是本次把它纳入 CI 的直接动机。
# 本机实测验证：`ruff check scripts/`（pinned 0.11.11）⇒ All checks passed；
# 而随手写一行未定义名会立刻报 F821 ⇒ 门禁有牙。

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["easy_tdx"]
omit = ["tests/*"]

[tool.coverage.report]
# 覆盖率门槛。V395 从 65 提升到 70：补齐 unified/strength/market/monitor/sina
# 与 chanlun 路由测试后实测 69.57%（2821 passed）。
fail_under = 70
show_missing = true
